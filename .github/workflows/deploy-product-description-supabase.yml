name: Deploy Product Description Supabase

on:
  push:
    branches:
      - v6-deploy-test
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Deploy Product Description Edge Function
        run: |
          supabase functions deploy generer-description-produit \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --no-verify-jwt \
            --use-api
